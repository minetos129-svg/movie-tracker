<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Clock</title>
    <meta
      name="description"
      content="A fake clock website with analog and digital time, time zones, and adjustable speed."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">F</div>
          <div>
            <p class="eyebrow">Simulation</p>
            <h1>Fake Clock</h1>
          </div>
        </div>
      </header>

      <main class="clock-layout">
        <section class="clock-panel analog-panel">
          <div class="clock-face" aria-label="Analog clock face">
            <div class="clock-center"></div>
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>

            <span class="digit d12">12</span>
            <span class="digit d3">3</span>
            <span class="digit d6">6</span>
            <span class="digit d9">9</span>
          </div>
        </section>

        <section class="clock-panel digital-panel">
          <div class="status-row">
            <span class="live-pill" id="liveStatus">Running</span>
            <span class="speed-pill" id="speedLabel">1x</span>
          </div>

          <div class="time-block">
            <p class="label">Current time</p>
            <h2 id="digitalTime">00:00:00</h2>
          </div>

          <div class="date-block">
            <p class="label">Date</p>
            <p id="dateValue">Monday, January 1</p>
          </div>

          <div class="timezone-control">
            <label for="timezoneSelect">Timezone</label>
            <select id="timezoneSelect" aria-label="Choose timezone">
              <option value="local">Local</option>
              <option value="UTC">UTC</option>
              <option value="America/New_York">New York</option>
              <option value="Europe/London">London</option>
              <option value="Europe/Paris">Paris</option>
              <option value="Asia/Tokyo">Tokyo</option>
              <option value="Australia/Sydney">Sydney</option>
            </select>
          </div>
        </section>
      </main>

      <section class="controls-panel">
        <div class="button-row main-controls">
          <button class="control-btn primary" id="toggleClock">Pause</button>
          <button class="control-btn" id="resetClock">Reset</button>
        </div>

        <div class="button-row speed-controls">
          <button class="control-btn" id="slowSpeed">Slow</button>
          <button class="control-btn" id="normalSpeed">Normal</button>
          <button class="control-btn" id="fastSpeed">Fast</button>
        </div>

        <div class="button-row jump-controls">
          <button class="control-btn" id="minusHour">-1 hour</button>
          <button class="control-btn" id="plusHour">+1 hour</button>
          <button class="control-btn" id="minusMinute">-30 min</button>
          <button class="control-btn" id="plusMinute">+30 min</button>
        </div>

        <div class="custom-time">
          <label for="customTimeInput">Set time</label>
          <input type="time" id="customTimeInput" value="00:00" />
          <button class="control-btn primary" id="applyTime">Apply</button>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
